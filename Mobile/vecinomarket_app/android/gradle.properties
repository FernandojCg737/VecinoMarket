org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# El proyecto vive en D: pero el SDK de Flutter/caché de Gradle está en C:;
# la compilación incremental de Kotlin calcula rutas relativas entre archivos
# y falla cuando están en discos distintos en Windows ("different roots").
# Sin esto ningún plugin nativo (shared_preferences, flutter_secure_storage)
# compila. Solo afecta la velocidad de recompilación, no el resultado.
kotlin.incremental=false
